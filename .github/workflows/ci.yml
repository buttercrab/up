name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Check formatting and module metadata
        shell: bash
        run: |
          test -z "$(gofmt -l .)"
          go mod tidy -diff
          go mod verify
      - run: go vet ./...
      - name: Test real terminal flows and concurrency
        run: go test -race -count=1 ./...
      - name: Build and smoke test without upgrading host packages
        shell: bash
        run: |
          go build -mod=readonly -o "$RUNNER_TEMP/up" ./cmd/up
          "$RUNNER_TEMP/up" --version
          "$RUNNER_TEMP/up" --help
          "$RUNNER_TEMP/up" --demo --plain --yes --jobs 3

  vulnerabilities:
    name: Reachable vulnerabilities
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
      - run: govulncheck ./...
